    <title id="sch-t">Schéma complet du wind sim</title>
    <desc id="sch-d">L’écran LCD avec son adaptateur I2C se relie à l’Arduino : SCL vers A5, SDA vers A4, GND vers GND, VCC vers 5V. L’alimentation 12 V alimente un mini WAGO +12 V et un mini WAGO masse. Les deux ventilateurs, sur leurs rallonges coupées, envoient leurs fils jaunes au +12 V et noirs à la masse ; le bleu gauche va à D9, le bleu droit à D10, les verts sont isolés. Un GND de l’Arduino rejoint la masse. Chaque fil arrive sur l’Arduino par un picot du kit soudé.</desc>
