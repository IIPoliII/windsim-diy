<style>:root{--card:#ffffff;--ink:#171b19;--w-yellow:#d9a400;--w-blue:#2b6be0;--w-green:#1f9a5c}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#171b19;font-size:12px}
.muted{fill:var(--muted)}
.box{fill:#ffffff;stroke:#171b19;stroke-width:2}
.title{font-weight:700;font-size:13px}
.pin{fill:#171b19}
.w{fill:none;stroke-width:3;stroke-linejoin:round}
.w-yellow{stroke:#d9a400}
