    <text class="muted" x="20" y="672">Petit pont : les fils se croisent sans contact. Vert : coupé court et isolé.</text>
    <text class="muted" x="20" y="694">Picot doré : picot de la barrette du kit, soudé au fil et enfoncé dans l’Arduino.</text>
